[project]
name = "walle"
version = "0.0.1"
description = "Append-only memory for AI agent harnesses. The memory is a file you own."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "shravankgl", email = "shravan.kgl@gmail.com" }]
dependencies = [
  "aisuite[ollama]>=0.2.0",
  "click>=8.1",
  "fastmcp>=4.1",
  "pydantic>=2.7",
]

[project.scripts]
walle = "walle.cli:main"
walle-hook = "walle.hook:main"
walle-mcp = "walle.mcp_server:main"

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.6",
  "pyright>=1.1.380",
  "pre-commit>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/walle"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# E/W pycodestyle, F pyflakes, I isort, B bugbear, UP pyupgrade, SIM simplify, RUF ruff-specific
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
